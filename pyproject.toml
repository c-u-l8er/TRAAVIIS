[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traaviis"
version = "0.1.0"
description = "TRAAVIIS -- a local-first toolchain for evidence-grade agent evaluation, with TRVM worlds as its exact-replay substrate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "c-u-l8er" }]
keywords = ["agent-evaluation", "eval", "evidence-grade", "deterministic", "wallriderlang", "wrl", "trvm", "cli"]

# No third-party Python runtime dependencies. The world commands (id/inspect/run/
# verify/replay/diff) require the Forge/TRVM engine at runtime (see traaviis.engine)
# and native verification requires the ic32 reducer; Residency evaluation
# (eval-one) does not require Forge unless the task requires the identity verifier.
dependencies = []

[project.scripts]
trvs = "traaviis.cli:main"
traaviis = "traaviis.cli:main"

[tool.setuptools]
packages = ["traaviis"]
